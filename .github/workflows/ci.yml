name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-examples:
    name: Validate examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: python -m pip install "check-jsonschema==0.38.2"

      - name: Validate schemas and examples
        run: scripts/validate-examples.sh

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

  ci-ok:
    name: CI OK
    needs: [validate-examples, markdownlint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          VALIDATE_EXAMPLES: ${{ needs.validate-examples.result }}
          MARKDOWNLINT: ${{ needs.markdownlint.result }}
        run: |
          echo "validate-examples: $VALIDATE_EXAMPLES"
          echo "markdownlint: $MARKDOWNLINT"
          if [ "$VALIDATE_EXAMPLES" != "success" ] || [ "$MARKDOWNLINT" != "success" ]; then
            echo "CI OK: a required job failed or was skipped" >&2
            exit 1
          fi
          echo "CI OK"
