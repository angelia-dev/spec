name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-examples:
    name: Validate examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: python -m pip install "check-jsonschema==0.38.2"

      - name: Validate schemas and examples
        run: scripts/validate-examples.sh

      # jsonschema and ruamel.yaml come with check-jsonschema.
      - name: Check the MCP tool contract and its examples
        run: scripts/check-mcp-tools.py

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # Ruleset: .spectral.yaml. Any finding, down to a hint, fails the job.
      - name: Run Spectral
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint --fail-severity=hint openapi/angelia.v1.yaml

  go-stubs:
    name: Go stubs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # Same action and Go toolchain as the core repository's CI.
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Generate and compile server stubs (oapi-codegen v2.8.2)
        run: scripts/check-go-stubs.sh

  ci-ok:
    name: CI OK
    needs: [validate-examples, markdownlint, openapi-lint, go-stubs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          VALIDATE_EXAMPLES: ${{ needs.validate-examples.result }}
          MARKDOWNLINT: ${{ needs.markdownlint.result }}
          OPENAPI_LINT: ${{ needs.openapi-lint.result }}
          GO_STUBS: ${{ needs.go-stubs.result }}
        run: |
          echo "validate-examples: $VALIDATE_EXAMPLES"
          echo "markdownlint: $MARKDOWNLINT"
          echo "openapi-lint: $OPENAPI_LINT"
          echo "go-stubs: $GO_STUBS"
          if [ "$VALIDATE_EXAMPLES" != "success" ] || [ "$MARKDOWNLINT" != "success" ] || [ "$OPENAPI_LINT" != "success" ] || [ "$GO_STUBS" != "success" ]; then
            echo "CI OK: a required job failed or was skipped" >&2
            exit 1
          fi
          echo "CI OK"
